spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investmentdb}
    username: ${DB_USERNAME:trackit}
    password: ${DB_PASSWORD:trackit_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  h2:
    console:
      enabled: false

server:
  port: 8080

# AWS LocalStack config
cloud:
  aws:
    region:
      static: ${AWS_REGION:eu-central-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}

# S3 bucket for CSV uploads
app:
  s3:
    bucket: trackit-imports

internal:
  key: ${INTERNAL_KEY:internal-service-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs